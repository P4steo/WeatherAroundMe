[project]
name = "weatheraroundme"
version = "0.1.0"
description = "simple weather station"
readme = "README.md"
authors = [
    { name = "Pawel", email = "beigerpawel@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "requests==2.31.0",
]

[project.scripts]
weatheraroundme = "weatheraroundme:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
